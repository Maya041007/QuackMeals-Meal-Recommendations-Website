<!DOCTYPE html>
<a href="index.html"class = "Home">Home</a>
<a href="Instruc.html">Instructions</a>

<html>
<head>
    <title>Quack Meals</title>
    <link rel="stylesheet" href="Survey.css">
</head>
    <body>
        <header> 
            <img class="logo_size" src="QuackMeals Logo.jpg" alt="Quack Meals Logo">
            <img class="logo2_size" src="QuackMeals Logo.jpg" alt="Quack Meals Logo">
            <h1 class="logo">Input Your Specifications</h1>
        </header>

        <div class="body">
        
        <h2>

            <form id="surveyForm">
                <label>Height (inches):</label>
                <input type="number" id="height" required><br><br>

                <label>Weight (lbs):</label>
                <input type="number" id="weight" required><br><br>

                <label>Budget ($ per meal):</label>
                <input type="number" id="budget" required><br><br>

                <label>Fitness Goal:</label>
                <select id="goal">
                    <option value="lose">Lose Weight</option>
                    <option value="gain">Gain Weight</option>
                    <option value="maintain">Maintain Weight</option>
                </select><br><br>

                <label>Activity Level:</label>
                <select id="activity">
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select><br><br>

                <button type="button" id="submitBtn">Get Meals</button>
            </form>

        </h2>
        </div>

        <script src="survey.js"></script>
        </div>
    </body>
</html>
